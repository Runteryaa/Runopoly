name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write


jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💾 Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: npm install

      - name: 📝 Bump Version & Update Server
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const parts = data.expo.version.split('.');
          data.expo.version = \`\${parts[0]}.\${parts[1]}.\${process.env.RUN_NUMBER}\`;
          fs.writeFileSync('app.json', JSON.stringify(data, null, 2));
          console.log('NEW_VERSION=' + data.expo.version);
          " >> $GITHUB_ENV
          
          # Same step: immediately ping the server
          source $GITHUB_ENV
          curl -s -X POST ${{ secrets.UPDATE_ENDPOINT }} \
          -H "Content-Type: application/json" \
          -d "{\"version\":\"${NEW_VERSION}\", \"secret\":\"${{ secrets.UPDATE_TOKEN }}\"}"

      - name: 🚀 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          
      - name: 🔄 Publish OTA Update
        run: eas update --auto --non-interactive


      - name: 🛠 Prebuild & Build APK
        run: |
          npx expo prebuild --platform android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache

      - name: 🚚 Rename APK
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          mv android/app/build/outputs/apk/release/app-release.apk runopoly-${APP_VERSION}.apk
          echo "APK_NAME=runopoly-${APP_VERSION}.apk" >> $GITHUB_ENV
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: 🏷 Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ github.run_number }}
          name: Runopoly v${{ env.APP_VERSION }} (Build ${{ github.run_number }})
          body: |
            Runopoly APK Release
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
